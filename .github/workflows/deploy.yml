name: Build and Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CONTAINER_NAME: go-gateway
  HOST_PORT: 8080
  CONTAINER_PORT: 8080

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        working-directory: go-gateway
        run: |
          go vet ./...
          go test -v ./...

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload code to server
        run: |
          rsync -avz --delete --exclude '.git' go-gateway/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/go-gateway/

      - name: Build and run container
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} /bin/bash -s << 'REMOTE_SCRIPT'
          set -e

          cd /opt/go-gateway
          docker build -t go-gateway:latest .

          docker stop go-gateway 2>/dev/null || true
          docker rm go-gateway 2>/dev/null || true

          docker run -d \
            --name go-gateway \
            --restart unless-stopped \
            -p 8080:8080 \
            -e LITELLM_MASTER_KEY="${{ secrets.LITELLM_MASTER_KEY }}" \
            -e GLM_API_KEY="${{ secrets.GLM_API_KEY }}" \
            -e MIMO_API_KEY="${{ secrets.MIMO_API_KEY }}" \
            -e LONGCAT_API_KEY="${{ secrets.LONGCAT_API_KEY }}" \
            -e EASYCLAW_API_KEY="${{ secrets.EASYCLAW_API_KEY }}" \
            -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            -e PORT=8080 \
            -e LOG_LEVEL=info \
            go-gateway:latest

          sleep 5

          if curl -sf http://localhost:8080/health; then
            echo "✅ Deploy OK"
          else
            echo "⚠️  Health check failed"
            docker logs --tail 50 go-gateway
            exit 1
          fi
          REMOTE_SCRIPT
