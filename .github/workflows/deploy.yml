name: Build and Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CONTAINER_NAME: go-gateway
  HOST_PORT: 8080
  CONTAINER_PORT: 8080

jobs:
  test-and-build:
    name: Test and Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        working-directory: go-gateway
        run: |
          go vet ./...
          go test -v ./...

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: go-gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/go-gateway:latest
            ghcr.io/${{ github.repository_owner }}/go-gateway:${{ github.sha }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} /bin/bash -s << 'REMOTE_SCRIPT'
          set -e

          IMAGE="ghcr.io/${{ github.repository_owner }}/go-gateway:latest"

          # 登录 GitHub Container Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # 拉取最新镜像
          docker pull ${IMAGE}

          # 停止旧容器
          docker stop go-gateway 2>/dev/null || true
          docker rm go-gateway 2>/dev/null || true

          # 启动新容器
          docker run -d \
            --name go-gateway \
            --restart unless-stopped \
            -p 8080:8080 \
            -e LITELLM_MASTER_KEY="${{ secrets.LITELLM_MASTER_KEY }}" \
            -e GLM_API_KEY="${{ secrets.GLM_API_KEY }}" \
            -e MIMO_API_KEY="${{ secrets.MIMO_API_KEY }}" \
            -e LONGCAT_API_KEY="${{ secrets.LONGCAT_API_KEY }}" \
            -e EASYCLAW_API_KEY="${{ secrets.EASYCLAW_API_KEY }}" \
            -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            -e PORT=8080 \
            -e LOG_LEVEL=info \
            ${IMAGE}

          sleep 2

          if curl -sf http://localhost:8080/health; then
            echo "✅ Deploy OK"
          else
            echo "⚠️  Health check failed"
            docker logs --tail 20 go-gateway
            exit 1
          fi
          REMOTE_SCRIPT
