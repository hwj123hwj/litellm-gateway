name: Build and Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HOST_PORT: 4001

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        working-directory: go-gateway
        run: |
          go vet ./...
          go test -v ./...

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cross-compile binary
        working-directory: go-gateway
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o gateway-linux .
          echo "Binary built: $(ls -lh gateway-linux | awk '{print $5}')"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Deploy binary and restart
        run: |
          set -e
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

          # 1. Upload binary
          cd go-gateway
          $SCP_CMD gateway-linux "$HOST:/opt/go-gateway/gateway-linux.new"
          rm -f gateway-linux

          # 2. Upload providers.yaml + scripts/config
          $SCP_CMD providers.yaml "$HOST:/opt/go-gateway/"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' \
            --exclude '*.go' \
            --exclude 'go.*' \
            --exclude 'gateway-linux*' \
            internal/ "$HOST:/opt/go-gateway/internal/"

          # 3. Swap binary, update env, restart service
          $SSH_CMD "$HOST" /bin/bash -s << REMOTE_SCRIPT
          set -e
          cd /opt/go-gateway

          # Swap in new binary
          mv gateway-linux.new gateway
          chmod 755 gateway

          # Update systemd service env vars
          cat > /etc/systemd/system/go-gateway.service << SERVICEOF
          [Unit]
          Description=LLM Gateway
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/go-gateway
          ExecStart=/opt/go-gateway/gateway
          Restart=always
          RestartSec=5
          Environment=PORT=4001
          Environment=LOG_LEVEL=info
          SERVICEOF

          # Append secrets from GitHub
          cat >> /etc/systemd/system/go-gateway.service << SERVICEOF
          Environment=LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
          Environment=GLM_API_KEY=${GLM_API_KEY}
          Environment=MIMO_API_KEY=${MIMO_API_KEY}
          Environment=LONGCAT_API_KEY=${LONGCAT_API_KEY}
          Environment=EASYCLAW_API_KEY=${EASYCLAW_API_KEY}
          SERVICEOF

          cat >> /etc/systemd/system/go-gateway.service << SERVICEOF

          [Install]
          WantedBy=multi-user.target
          SERVICEOF

          systemctl daemon-reload
          systemctl restart go-gateway

          for i in 1 2 3 4 5; do
            sleep 3
            if curl -sf http://localhost:4001/health; then
              echo ""
              echo "✅ Deploy OK"
              exit 0
            fi
            echo "⏳ Waiting for gateway to start (attempt \$i)..."
          done
          echo "⚠️  Health check failed after 5 attempts"
          journalctl -u go-gateway --no-pager -n 30
          exit 1
          REMOTE_SCRIPT
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          EASYCLAW_API_KEY: ${{ secrets.EASYCLAW_API_KEY }}

  deploy-mini-pc:
    name: Deploy to Mini PC
    runs-on: [self-hosted, mini-pc]
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        working-directory: go-gateway
        run: |
          go build -o gateway .
          echo "Binary built: $(ls -lh gateway | awk '{print $5}')"

      - name: Deploy locally
        run: |
          set -e
          DEPLOY_DIR="/home/q/litellm-gateway"

          # 1. Copy the new binary
          cp go-gateway/gateway "$DEPLOY_DIR/go-gateway/gateway.new"
          chmod 755 "$DEPLOY_DIR/go-gateway/gateway.new"

          # 2. Copy config files
          cp go-gateway/providers.yaml "$DEPLOY_DIR/go-gateway/providers.yaml" 2>/dev/null || true

          # 3. Stop current service, swap binary, restart
          cd "$DEPLOY_DIR/go-gateway"
          mv gateway.new gateway

          # Restart via systemd user service or direct process
          if systemctl --user list-units --type=service 2>/dev/null | grep -q go-gateway; then
            systemctl --user restart go-gateway
          else
            # Kill existing and restart
            pkill -f "go-gateway/gateway" 2>/dev/null || true
            sleep 1
            nohup ./gateway &>/dev/null &
          fi

          # 4. Health check
          sleep 3
          if curl -sf http://localhost:4001/health; then
            echo "✅ Mini PC Deploy OK"
          else
            echo "⚠️  Health check failed, checking logs..."
            journalctl --user -u go-gateway --no-pager -n 20 2>/dev/null || true
            exit 1
          fi
