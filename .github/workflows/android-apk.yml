name: Build Android APK

on:
  push:
    tags:
      - 'v*'           # 推送 v1.0.0 等 tag 时触发
  workflow_dispatch:     # 手动触发

jobs:
  build-android:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 创建 Release 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      # ── Java (Android 构建需要) ──
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK ──
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 安装依赖 ──
      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      # ── Expo Prebuild（生成原生 Android 项目）──
      - name: Expo Prebuild
        working-directory: mobile-app
        run: npx expo prebuild --platform android --clean

      # ── 构建 APK ──
      - name: Build APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease --no-daemon

      # ── 签名 APK（可选，使用 debug keystore）──
      # 如果需要正式签名，在 Settings > Secrets 中配置 KEYSTORE_BASE64 等
      # - name: Sign APK
      #   run: |
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
      #     jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
      #       -keystore keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
      #       mobile-app/android/app/build/outputs/apk/release/app-release-unsigned.apk \
      #       "${{ secrets.KEY_ALIAS }}"

      # ── 上传 Artifact ──
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: litellm-admin-apk
          path: mobile-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── 创建 GitHub Release（仅 tag 触发）──
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "LiteLLM Admin ${{ github.ref_name }}"
          body: |
            ## LiteLLM Admin Android APK

            ### 安装说明
            1. 下载下方 `app-release.apk`
            2. 在 Android 设备上允许"未知来源"安装
            3. 打开 APK 安装

            ### 首次使用
            - 启动后输入 Gateway 后端地址（如 `http://192.168.x.x:4001`）
            - 输入 API Key（可选）
            - 点击"开始使用"

            ### 更新日志
            - 从 Capacitor (WebView) 迁移至 React Native
            - Hermes 引擎优化启动速度
            - FlashList 优化长列表滚动性能
          files: mobile-app/android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
