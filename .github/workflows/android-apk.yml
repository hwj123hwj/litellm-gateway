name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Expo Prebuild
        working-directory: mobile-app
        run: npx expo prebuild --platform android --no-install

      - name: Patch Android Manifest for Cleartext HTTP
        working-directory: mobile-app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== Before patch ==="
          grep "usesCleartextTraffic" "$MANIFEST" || echo "usesCleartextTraffic NOT FOUND"
          # Add usesCleartextTraffic and networkSecurityConfig to <application> tag
          sed -i 's/<application /<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config" /' "$MANIFEST"
          echo "=== After patch ==="
          grep "usesCleartextTraffic" "$MANIFEST"
          # Create network security config XML
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="true">
        <trust-anchors>
            <certificates src="system" />
        </trust-anchors>
    </base-config>
</network-security-config>
XMLEOF
          echo "=== network_security_config.xml created ==="
          cat android/app/src/main/res/xml/network_security_config.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Find APK
        working-directory: mobile-app
        run: |
          echo "=== Looking for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | head -20
          echo "=== Listing build outputs ==="
          ls -laR android/app/build/outputs/ 2>/dev/null | head -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: litellm-admin-apk
          path: mobile-app/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "LiteLLM Admin ${{ github.ref_name }}"
          body: |
            ## LiteLLM Admin Android APK

            ### 安装说明
            1. 下载 `app-release.apk`
            2. 在 Android 设备允许"未知来源"安装
            3. 打开 APK 安装

            ### 首次使用
            - 启动后输入 Gateway 后端地址（如 `http://192.168.x.x:4001`）
            - 输入 API Key（可选）
            - 点击"开始使用"

            ### 更新日志
            - 从 Capacitor (WebView) 迁移至 React Native
            - Hermes 引擎优化启动速度
            - FlashList 优化长列表滚动性能
          files: mobile-app/android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
