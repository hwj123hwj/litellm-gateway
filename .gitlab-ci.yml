# GitLab CI/CD Pipeline — 构建并推送 Docker 镜像
# 在 GitLab 仓库 Settings → CI/CD → Variables 中配置:
#   DEPLOY_HOST: 115.190.82.67
#   DEPLOY_USER: root (或你的 SSH 用户名)
#   SSH_PRIVATE_KEY: -----BEGIN OPENSSH PRIVATE KEY----- ... (你的 SSH 私钥)
#   LITELLM_MASTER_KEY: 你的网关认证 token

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_REGISTRY: ${CI_REGISTRY}
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/go-gateway
  CONTAINER_NAME: go-gateway
  HOST_PORT: 8080

# ── 阶段 1: 单元测试 ──────────────────────────────────
test:
  stage: test
  image: golang:1.21-alpine
  before_script:
    - cd go-gateway
  script:
    - go vet ./...
    - go test -v ./...
  only:
    - main
    - merge_requests

# ── 阶段 2: 构建 Docker 镜像 ──────────────────────────
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} -t ${IMAGE_NAME}:latest -f go-gateway/Dockerfile go-gateway/
    - docker push ${IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${IMAGE_NAME}:latest
  only:
    - main

# ── 阶段 3: 部署到服务器 ──────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - |
      ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -o StrictHostKeyChecking=yes ${DEPLOY_USER}@${DEPLOY_HOST} /bin/bash -s << 'REMOTE_SCRIPT'
      set -e

      # ── 登录 GitLab Registry ──────────────────────────
      echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"

      # ── 拉取最新镜像 ─────────────────────────────────
      docker pull ${IMAGE_NAME}:latest

      # ── 停止旧容器 ───────────────────────────────────
      docker stop ${CONTAINER_NAME} 2>/dev/null || true
      docker rm ${CONTAINER_NAME} 2>/dev/null || true

      # ── 创建 .env 文件（如果不存在）
      mkdir -p /opt/go-gateway
      cat > /opt/go-gateway/.env << 'ENVFILE'
      # 请在实际部署前把以下 API key 替换为真实值
      # 或者通过 GitLab CI Variables 传入
      LITELLM_MASTER_KEY=sk-local-gateway-xxx
      GLM_API_KEY=
      MIMO_API_KEY=
      LONGCAT_API_KEY=
      EASYCLAW_API_KEY=
      OPENROUTER_API_KEY=
      PORT=8080
      LOG_LEVEL=info
      ENV=production
      ENVFILE

      # ── 启动新容器 ───────────────────────────────────
      docker run -d \
        --name ${CONTAINER_NAME} \
        --restart unless-stopped \
        -p ${HOST_PORT}:8080 \
        --env-file /opt/go-gateway/.env \
        -e LITELLM_MASTER_KEY="${LITELLM_MASTER_KEY}" \
        -e GLM_API_KEY="${GLM_API_KEY}" \
        -e MIMO_API_KEY="${MIMO_API_KEY}" \
        -e LONGCAT_API_KEY="${LONGCAT_API_KEY}" \
        -e EASYCLAW_API_KEY="${EASYCLAW_API_KEY}" \
        -e OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" \
        -e PORT=8080 \
        ${IMAGE_NAME}:latest

      # ── 等待启动并做健康检查 ─────────────────────────
      sleep 2
      curl -sf http://localhost:${HOST_PORT}/health && echo "Deploy OK" || echo "Deploy WARNING: health check failed"
      REMOTE_SCRIPT
  only:
    - main
  when: manual
