# 模型提供商配置
# 命名规则：
#   - GLM / MiMo / LongCat 核心供应商保留分级别名 (haiku/sonnet/opus)
#   - 其他供应商统一用 供应商-模型名 格式，不占用通用别名
#   - chain 中引用 model-bound provider（格式：供应商名-模型ID）

providers:
  # 智谱 GLM（核心供应商，保留 haiku/sonnet/opus 别名）
  - name: glm
    type: openai
    url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    models:
      - id: glm-5-turbo
        aliases: [glm-sonnet]
      - id: glm-4.7
        aliases: [glm-haiku]
      - id: glm-5.1
        aliases: [glm-opus]
      - id: glm-4.7-flash
        aliases: [glm-flash]

  # 小米 MiMo（核心供应商，保留 haiku/sonnet/opus 别名）
  - name: mimo
    type: anthropic
    url: https://token-plan-cn.xiaomimimo.com/anthropic/v1/messages
    api_key_env: MIMO_API_KEY
    models:
      - id: mimo-v2.5
        aliases: [mimo-sonnet]
      - id: mimo-v2.5-pro
        aliases: [mimo-opus]

  # 美团 LongCat（核心供应商，保留 haiku/sonnet/opus 别名）
  - name: longcat
    type: openai
    url: https://api.longcat.chat/openai/chat/completions
    api_key_env: LONGCAT_API_KEY
    models:
      - id: LongCat-Flash-Chat
        aliases: [longcat-sonnet]
      - id: LongCat-2.0-Preview
        aliases: [longcat-opus]

  # EasyClaw（Claude 代理）
  - name: easyclaw
    type: openai
    url: https://api.easyclaw.work/v1/chat/completions
    api_key_env: EASYCLAW_API_KEY
    models:
      - id: claude-sonnet-4-6
        aliases: [easyclaw-sonnet]
      - id: claude-opus-4-6
        aliases: [easyclaw-opus]

  # APIFree（SkyClaw agent 模型 — 独家，用 sky- 前缀好记）
  - name: apifree
    type: openai
    url: https://api.apifree.ai/agent/v1/chat/completions
    api_key_env: APIFREE_API_KEY
    models:
      - id: skywork-ai/skyclaw-v1
        aliases: [sky-opus]
      - id: skywork-ai/skyclaw-v1-lite
        aliases: [sky-lite]

  # OpenRouter（GPT + 免费模型）
  - name: openrouter
    type: openai
    url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    models:
      - id: openai/gpt-5.5
        aliases: [gpt-5.5]
        provider_name: or-gpt55
      - id: deepseek/deepseek-v4-flash:free
        aliases: [free-deepseek]
        provider_name: or-deepseek
      - id: moonshotai/kimi-k2.6:free
        aliases: [free-kimi]
        provider_name: or-kimi

# Fallback 链配置
# 当第一个提供商失败时，自动尝试下一个
# 引用格式：供应商名-模型ID（与 SetupProvidersFromConfig 注册的 provider 名一致）
chains:
  coding:
    - glm-glm-5-turbo
    - mimo-mimo-v2.5
    - longcat-LongCat-Flash-Chat

  coding-anthropic:
    - mimo-mimo-v2.5
    - longcat-LongCat-Flash-Chat

  # free 兜底链：deepseek → kimi
  free:
    - or-deepseek
    - or-kimi
