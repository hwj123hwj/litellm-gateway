# 模型提供商配置
# 命名规则：
#   - GLM 核心供应商保留分级别名 (haiku/sonnet/opus)
#   - 其他供应商统一用 供应商-模型名 格式，不占用通用别名
#   - chain 中引用 model-bound provider（格式：供应商名-模型ID）

providers:
  # 智谱 GLM（核心供应商，保留 haiku/sonnet/opus 别名）
  - name: glm
    type: openai
    url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    # GLM-5.2 reasoning requests used by the knowledge flywheel can exceed
    # the normal 120-second provider deadline. Keep this provider-level
    # timeout explicit and configurable instead of silently opening the
    # circuit while a valid long-running request is still being processed.
    request_timeout_seconds: 900
    models:
      - id: glm-5.2
        aliases: [glm-opus]
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: glm-5.3
        # 始终思考模型：上游不接受 thinking:disabled（网关侧自动丢弃该参数）
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: glm-5-turbo
        aliases: [glm-sonnet]
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: glm-4.7
        aliases: [glm-haiku]
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: glm-4.7-flash
        capabilities: [text, tool_calling, streaming]

  # GLM 视觉模型：不要复用 glm-sonnet（它绑定的是文本 GLM-5-Turbo）。
  - name: glm-vision
    type: openai
    url: https://open.bigmodel.cn/api/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    models:
      - id: glm-5v-turbo
        aliases: [glm-vision]
        capabilities: [text, vision, video, file, tool_calling, streaming, reasoning]
        input_modalities: [text, image, video, file]

  # 阿里 MaaS（Qwen 3.8 Max）
  - name: ali
    type: openai
    url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions
    api_key_env: ALI_API_KEY
    models:
      - id: qwen3.8-max-preview
        aliases: [ali-opus, qwen3.8-max]
        capabilities: [text, tool_calling, streaming, reasoning]

  # ChatGPT Plus/Pro Codex subscription. The provider reads OAuth credentials
  # from Codex CLI/Pi auth.json; HTTP_PROXY is optional and only controls
  # network access.
  - name: chatgpt
    type: chatgpt
    url: https://chatgpt.com/backend-api
    models:
      - id: gpt-5.6-sol
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-5.6-luna
        aliases: [gpt-luna]
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-5.6-terra
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
chains:
  coding:
    # wiki 代理（openwiki personal）走此链。原 glm-5-turbo 是 GLM 家最弱档，
    # wiki 输出质量明显弱于卡片编译（glm-opus 链），升级到 5.2 对齐。
    - glm-glm-5.2
    - ali-qwen3.8-max-preview

  coding-anthropic:
    - glm-glm-5-turbo
    - ali-qwen3.8-max-preview

  # Knowledge flywheel chain. Keep the stable glm-opus model name for clients
  # while routing failures to the bound Ali model and optional Copilot provider.
  glm-opus:
    - ali-qwen3.8-max-preview
    - copilot
    - glm-glm-5.2
