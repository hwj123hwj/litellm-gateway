# 模型提供商配置
# 命名规则：
#   - provider 实例名与对外模型名都用上游模型 ID，不设置别名
#   - 不同供应商提供同名模型时（如智谱与 DeepV 都有 glm-5.3-flash），
#     后注册的那个用 供应商-模型 限定，保证实例名唯一
#   - 客户端只调用 chains 里定义的链，链内按顺序持续降级

providers:
  # 智谱 GLM
  - name: glm
    type: openai
    url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    # GLM-5.3 reasoning 请求可能超过常规 120 秒上游期限，显式放宽，
    # 避免长请求仍在处理时被本地超时中断并计入熔断。
    request_timeout_seconds: 900
    models:
      - id: glm-5.3
        # 始终思考模型：上游不接受 thinking:disabled（网关侧自动丢弃该参数）
        capabilities: [text, tool_calling, streaming, reasoning]
      # flash 同样支持图片输入（实测 coding/paas 两个端点都收 image_url），
      # 因此图片能力落在这一档，不再单开一个更弱的 glm-5v-turbo 供应商。
      - id: glm-5.3-flash
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]

  # ChatGPT Plus/Pro Codex subscription. The provider reads OAuth credentials
  # from Codex CLI/Pi auth.json; HTTP_PROXY is optional and only controls
  # network access.
  - name: chatgpt
    type: chatgpt
    url: https://chatgpt.com/backend-api
    models:
      # GPT-6 家族（账号当前主线）。gpt-6-terra 不存在、gpt-6-pro 与各 -wm
      # 变体在 Codex 订阅端点会被拒（HTTP 400 "not supported"），故不登记。
      - id: gpt-6-sol
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-6-luna
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-6-astra
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      # GPT-5.6 家族：上游仍在服务，且部分客户端配置仍引用这些名字。
      - id: gpt-5.6-sol
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-5.6-luna
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-5.6-terra
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000

  # Antigravity（Google 账号 OAuth，由本机 8317 端口的 CLIProxyAPI 反代）。
  # 凭据/token 续期都在 CLIProxyAPI 侧维护，网关只当普通 OpenAI 兼容上游用；
  # CLIPROXY_API_KEY 是 CLIProxyAPI config.yaml 里的静态 api-key。
  # gemini-3.8-flash 是当前 Gemini 系列主力（-high 为思考档后缀，属上游真名），
  # 实测接受 image_url（vision 落在这一档）。
  - name: antigravity
    type: openai
    url: http://127.0.0.1:8317/v1/chat/completions
    api_key_env: CLIPROXY_API_KEY
    request_timeout_seconds: 900
    models:
      - id: gemini-3.8-flash-high
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
  # 硅基流动：免费嵌入与电信 ASR。url 配上游源站，embeddings / audio
  # transcriptions 端点由网关透传时在其后拼接路径；两个模型都不注册 chat
  # 能力，不会被聊天路由选中。
  - name: siliconflow
    type: openai
    url: https://api.siliconflow.cn
    api_key_env: SILICONFLOW_API_KEY
    models:
      - id: BAAI/bge-m3
        capabilities: [embedding]
      # 免费兜底
      - id: FunAudioLLM/SenseVoiceSmall
        capabilities: [audio_transcription]
      # 讯飞星辰 ASR 系列（V3.2 主力 / Ultra 高精度 / Diarize 带说话人分离）
      - id: XingChenAGI/XingChenASR-V3.2
        capabilities: [audio_transcription]
      - id: XingChenAGI/XingChenASR-V3.2-Ultra
        capabilities: [audio_transcription]
      - id: XingChenAGI/XingChenASR-Diarize-V3.0
        capabilities: [audio_transcription]
      # GSR 用途待确认，先注册实测
      - id: XingChenAGI/XingChenGSR-V1.0
        capabilities: [audio_transcription]

chains:
  # 唯一对外入口。按能力从强到弱排列，任一档失败（含限流、无权限、
  # 上游 5xx）都自动降级到下一档，客户端始终只调用这个名字。
  coding:
    - glm-5.3
    - glm-5.3-flash
    - gemini-3.8-flash-high
    - deepv-glm-5.3-flash
    - deepseek-flash
