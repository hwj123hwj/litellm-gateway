# 模型提供商配置
# 命名规则：
#   - GLM 核心供应商保留分级别名 (haiku/sonnet/opus)
#   - 其他供应商统一用 供应商-模型名 格式，不占用通用别名
#   - chain 中引用 model-bound provider（格式：供应商名-模型ID）

providers:
  # 智谱 GLM（核心供应商，保留 haiku/sonnet/opus 别名）
  - name: glm
    type: openai
    url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    models:
      - id: glm-5.2
        aliases: [glm-opus]
      - id: glm-5-turbo
        aliases: [glm-sonnet]
      - id: glm-4.7
        aliases: [glm-haiku]
      - id: glm-4.7-flash

  # 阿里 DashScope / 百炼（Qwen 通义千问）
  - name: dashscope
    type: openai
    url: https://coding.dashscope.aliyuncs.com/v1/chat/completions
    api_key_env: DASHSCOPE_API_KEY
    models:
      - id: qwen3.5-plus
        aliases: [qwen-plus, qwen-sonnet]
      - id: qwen3-coder-plus
        aliases: [qwen-coder, qwen-opus]
      - id: qwen3-coder-next
      - id: qwen3-max-2026-01-23

chains:
  coding:
    - glm-glm-5-turbo
    - dashscope-qwen3.5-plus

  coding-anthropic:
    - glm-glm-5-turbo
    - dashscope-qwen3.5-plus




