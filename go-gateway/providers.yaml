# 模型提供商配置
# 命名规则：
#   - GLM 核心供应商保留分级别名 (haiku/sonnet/opus)
#   - 其他供应商统一用 供应商-模型名 格式，不占用通用别名
#   - chain 中引用 model-bound provider（格式：供应商名-模型ID）

providers:
  # 智谱 GLM（核心供应商，保留 haiku/sonnet/opus 别名）
  - name: glm
    type: openai
    url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    # GLM-5.2 reasoning requests used by the knowledge flywheel can exceed
    # the normal 120-second provider deadline. Keep this provider-level
    # timeout explicit and configurable instead of silently opening the
    # circuit while a valid long-running request is still being processed.
    request_timeout_seconds: 900
    models:
      - id: glm-5.2
        aliases: [glm-opus]
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: glm-5-turbo
        aliases: [glm-sonnet]
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: glm-4.7
        aliases: [glm-haiku]
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: glm-4.7-flash
        capabilities: [text, tool_calling, streaming]

  # GLM 视觉模型：不要复用 glm-sonnet（它绑定的是文本 GLM-5-Turbo）。
  - name: glm-vision
    type: openai
    url: https://open.bigmodel.cn/api/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    models:
      - id: glm-5v-turbo
        aliases: [glm-vision]
        capabilities: [text, vision, video, file, tool_calling, streaming, reasoning]
        input_modalities: [text, image, video, file]

  # 阿里 MaaS（Qwen 3.8 Max）
  - name: ali
    type: openai
    url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions
    api_key_env: ALI_API_KEY
    models:
      - id: qwen3.8-max-preview
        aliases: [ali-opus, qwen3.8-max]
        capabilities: [text, tool_calling, streaming, reasoning]


chains:
  coding:
    - glm-glm-5-turbo
    - ali-qwen3.8-max-preview

  coding-anthropic:
    - glm-glm-5-turbo
    - ali-qwen3.8-max-preview


