# 模型提供商配置
# 支持两种类型：openai（OpenAI 兼容格式）和 anthropic（Anthropic 兼容格式）

providers:
  # Artizan Cloud（GPT-5.5）- 额度已用完，注释掉改用 SmartAll
  # - name: artizan
  #   type: openai
  #   url: https://artizancloud.com/v1/chat/completions
  #   api_key_env: ARTIZAN_API_KEY
  #   models:
  #     - id: gpt-5.5
  #       aliases: [gpt-5, artizan-gpt]

  # 智谱 GLM
  - name: glm
    type: openai
    url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    models:
      - id: glm-5-turbo
        aliases: [glm-sonnet, glm-5]
      - id: glm-4.7
        aliases: [glm-haiku]
      - id: glm-5.1
        aliases: [glm-opus]

  # 小米 MiMo
  - name: mimo
    type: anthropic
    url: https://token-plan-cn.xiaomimimo.com/anthropic/v1/messages
    api_key_env: MIMO_API_KEY
    models:
      - id: mimo-v2.5
        aliases: [mimo-sonnet]
      - id: mimo-v2.5-pro
        aliases: [mimo-opus]

  # 美团 LongCat
  - name: longcat
    type: openai
    url: https://api.longcat.chat/openai/chat/completions
    api_key_env: LONGCAT_API_KEY
    models:
      - id: LongCat-Flash-Chat
        aliases: [longcat-sonnet]
      - id: LongCat-2.0-Preview
        aliases: [longcat-opus]

  # EasyClaw（真实 Claude，Anthropic 格式）
  - name: easyclaw
    type: openai
    url: https://api.easyclaw.work/v1/chat/completions
    api_key_env: EASYCLAW_API_KEY
    models:
      - id: claude-sonnet-4-6
        aliases: [easyclaw-sonnet]
      - id: claude-opus-4-6
        aliases: [easyclaw-opus]

  # DeepV Server（需要特殊认证，在代码中单独处理）

  # SmartAll（GPT-5.5 & DeepSeek）
  - name: smartall
    type: openai
    url: https://ai.smartall.cloud/v1/chat/completions
    api_key_env: SMARTALL_API_KEY
    models:
      - id: gpt-5.5
        aliases: [gpt-5, sm-gpt55, sm-gpt5]
      - id: deepseek-ai/deepseek-v4-flash
        aliases: [ds, sm-ds, deepseek-flash, deepseek-v4-flash]

  # 如果要添加新的 OpenAI 兼容提供商，只需在这里添加：

  # 示例：添加一个新的提供商
  # - name: my-provider
  #   type: openai
  #   url: https://api.example.com/v1/chat/completions
  #   api_key_env: MY_PROVIDER_API_KEY
  #   models:
  #     - id: gpt-5.5
  #       aliases: [gpt-5]
  #     - id: claude-sonnet-4-6
  #       aliases: [claude-sonnet]

# Fallback 链配置
# 当第一个提供商失败时，自动尝试下一个
chains:
  coding:
    - glm
    - mimo
    - longcat

  coding-anthropic:
    - glm
    - mimo
    - longcat

  free:
    - openrouter-free-0
    - openrouter-free-1
