# 模型提供商配置
# 命名规则：
#   - GLM / MiMo / LongCat 核心供应商保留分级别名 (haiku/sonnet/opus)
#   - 其他供应商统一用 供应商-模型名 格式，不占用通用别名
#   - chain 中引用 model-bound provider（格式：供应商名-模型ID）

providers:
  # 智谱 GLM（核心供应商，保留 haiku/sonnet/opus 别名）
  - name: glm
    type: openai
    url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    models:
      - id: glm-5.2
        aliases: [glm-opus]
      - id: glm-5-turbo
        aliases: [glm-sonnet]
      - id: glm-4.7
        aliases: [glm-haiku]
      - id: glm-4.7-flash

  # 小米 MiMo — 使用原生 OpenAI API
  - name: mimo
    type: openai
    url: https://token-plan-cn.xiaomimimo.com/v1/chat/completions
    api_key_env: MIMO_API_KEY
    models:
      - id: mimo-v2.5
        aliases: [mimo-sonnet]
      - id: mimo-v2.5-pro
        aliases: [mimo-opus]

  # 美团 LongCat
  - name: longcat
    type: openai
    url: https://api.longcat.chat/openai/chat/completions
    api_key_env: LONGCAT_API_KEY
    models:
      - id: LongCat-2.0-Preview
        aliases: [longcat-opus]

  # EasyClaw（Claude 代理）
  - name: easyclaw
    type: openai
    url: https://api.easyclaw.work/v1/chat/completions
    api_key_env: EASYCLAW_API_KEY
    models:
      - id: claude-sonnet-4-6
        aliases: [easyclaw-sonnet]
      - id: claude-opus-4-6
        aliases: [easyclaw-opus]

chains:
  coding:
    - glm-glm-5-turbo
    - mimo-mimo-v2.5
    - longcat-LongCat-2.0-Preview

  coding-anthropic:
    - mimo-mimo-v2.5
    - longcat-LongCat-2.0-Preview


