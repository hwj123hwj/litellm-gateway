model_list:
  # ==================== 智谱 BigModel（主力） ====================
  - model_name: glm-haiku
    litellm_params:
      model: anthropic/glm-4.7
      api_base: https://open.bigmodel.cn/api/anthropic
      api_key: os.environ/GLM_API_KEY

  - model_name: glm-sonnet
    litellm_params:
      model: anthropic/glm-5-turbo
      api_base: https://open.bigmodel.cn/api/anthropic
      api_key: os.environ/GLM_API_KEY

  - model_name: glm-opus
    litellm_params:
      model: anthropic/glm-5.1
      api_base: https://open.bigmodel.cn/api/anthropic
      api_key: os.environ/GLM_API_KEY

  # ==================== 小米 MiMo（备用 1） ====================
  - model_name: mimo-haiku
    litellm_params:
      model: anthropic/mimo-v2.5
      api_base: https://token-plan-cn.xiaomimimo.com/anthropic
      api_key: os.environ/MIMO_API_KEY

  - model_name: mimo-sonnet
    litellm_params:
      model: anthropic/mimo-v2.5
      api_base: https://token-plan-cn.xiaomimimo.com/anthropic
      api_key: os.environ/MIMO_API_KEY

  - model_name: mimo-opus
    litellm_params:
      model: anthropic/mimo-v2.5-pro
      api_base: https://token-plan-cn.xiaomimimo.com/anthropic
      api_key: os.environ/MIMO_API_KEY

  # ==================== 美团 LongCat（备用 2） ====================
  - model_name: longcat
    litellm_params:
      model: anthropic/LongCat-Flash-Chat
      api_base: https://api.longcat.chat/anthropic
      api_key: os.environ/LONGCAT_API_KEY

  # ==================== 通用别名（支持 fallback） ====================
  # "coding" 组：智谱优先 → 小米 → 美团
  - model_name: coding
    litellm_params:
      model: anthropic/glm-5-turbo
      api_base: https://open.bigmodel.cn/api/anthropic
      api_key: os.environ/GLM_API_KEY
  - model_name: coding
    litellm_params:
      model: anthropic/mimo-v2.5
      api_base: https://token-plan-cn.xiaomimimo.com/anthropic
      api_key: os.environ/MIMO_API_KEY
  - model_name: coding
    litellm_params:
      model: anthropic/LongCat-Flash-Chat
      api_base: https://api.longcat.chat/anthropic
      api_key: os.environ/LONGCAT_API_KEY

router_settings:
  routing: "simple-shuffle"
  num_retries: 2
  timeout: 120
  fallbacks:
    - {"coding": ["coding"]}
  allowed_fails: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  callbacks: longcat_auth.longcat_auth_rewriter
